[project]
name = "v2r-command-system"
version = "0.1.0"
description = "V2R 채팅 명령형 내부 운영 시스템 (가상 테스트 사이트용)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
  "pillow>=10.3",
  "piexif>=1.1",
  "anthropic>=0.40",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-httpx>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["v2r*"]
