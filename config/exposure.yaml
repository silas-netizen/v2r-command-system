# 노출 확인 러너 설정 — docs/reports/exposure-speed-plan-2026-09-23.md 설계.
# exposure_runner.py / exposure_priority.py가 읽는다.

# 작업자(브라우저 상주 프로세스) 수. 2로 시작해 실측 후 올린다.
workers: 2

# 작업자별 요청 간격(초) — 무작위 범위
delay_min_sec: 6
delay_max_sec: 10

# 스크롤 조기 종료
max_scroll_rounds: 20       # 카페 카드가 하나도 없을 때의 상한(기존 값 유지)
scroll_wait_sec: 0.4
early_exit_same_height_rounds: 2   # 카페 카드 로드 후 문서 높이가 이만큼 연속 동일하면 중단

# 미확인(차단 의심) 연속 n건 → 그 작업자 휴식(분)
worker_block_streak_limit: 3
worker_rest_minutes: 15

# 전체 작업자가 동시에 휴식 상태 → 순환 전체 정지(분)
global_block_rest_minutes: 30

# 노출완 → 밀려남 2단계 확인(2026-09-24, 비만도 계산기 23:31 일시 변동 사례)
# 첫 밀려남은 확정하지 않고 이 범위(분) 안에서 무작위로 다시 확인한다.
pending_confirm_min_minutes: 5
pending_confirm_max_minutes: 10

# 우선순위 등급별 재검사 주기(시간) — exposure_priority.py
priority:
  # 2026-09-24 사용자 재정의 — 1 노출완(빠르게) → 2 최근 발행(빠르게) → 3 밀려남·미확인 검색량 높은 순
  exposed_recheck_hours: 6              # 1순위: 노출완 → 6시간마다 재확인
  recent_publish_hours: [2, 6, 24]      # 2순위: 발행 후 이 시각 근방(±2시간)이면 우선
  pushed_min_gap_hours: 12              # 3순위: 밀려남·미확인은 검색량 순, 같은 키워드는 12시간 지나야 다시
  top_volume_percentile: 0.7            # (보고용) 검색량 상위 30% 기준
