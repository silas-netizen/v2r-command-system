# 노출 확인 러너 설정 — docs/reports/exposure-speed-plan-2026-09-23.md 설계.
# exposure_runner.py / exposure_priority.py가 읽는다.

# 작업자(브라우저 상주 프로세스) 수. 2로 시작해 실측 후 올린다.
# 2026-09-24 — 실측 10(공유 큐, 중복 3.5%까지 개선)에서 차단 징후 여전히
# 0건이라 코디네이터 지시로 6으로 상향.
workers: 6

# 작업자별 요청 간격(초) — 무작위 범위
# 2026-09-24 — 실측 10까지 차단 징후(캡차·unknown 급증) 전혀 없어 코디네이터
# 지시로 좁힘(6-10초 → 3-5초). 실측 11에서 조금이라도 차단 징후가 보이면
# 즉시 원래 값(6-10초)으로 되돌린다.
delay_min_sec: 3
delay_max_sec: 5

# 스크롤 조기 종료
max_scroll_rounds: 20       # 카페 카드가 하나도 없을 때의 상한(기존 값 유지)
scroll_wait_sec: 0.4
early_exit_same_height_rounds: 2   # 카페 카드 로드 후 문서 높이가 이만큼 연속 동일하면 중단

# 미확인(차단 의심) 연속 n건 → 그 작업자 휴식(분)
worker_block_streak_limit: 3
worker_rest_minutes: 15

# 전체 작업자가 동시에 휴식 상태 → 순환 전체 정지(분)
global_block_rest_minutes: 30

# 노출완 → 밀려남 2단계 확인(2026-09-24, 비만도 계산기 23:31 일시 변동 사례)
# 첫 밀려남은 확정하지 않고 이 범위(분) 안에서 무작위로 다시 확인한다.
pending_confirm_min_minutes: 5
pending_confirm_max_minutes: 10

# 우선순위 등급별 재검사 주기(시간) — exposure_priority.py
priority:
  # 2026-09-24 사용자 재정의 — 1 노출완(빠르게) → 2 최근 발행(빠르게) → 3 밀려남·미확인 검색량 높은 순
  exposed_recheck_hours: 6              # 1순위: 노출완 → 6시간마다 재확인
  recent_publish_hours: [2, 6, 24]      # 2순위: 발행 후 이 시각 근방(±2시간)이면 우선
  pushed_min_gap_hours: 12              # 3순위: 밀려남·미확인은 검색량 순, 같은 키워드는 12시간 지나야 다시
  top_volume_percentile: 0.7            # (보고용) 검색량 상위 30% 기준
  # 2026-09-24 큐 캐시(exposure-speed-2026-09-24.md 6절) — keyword_universe(시트
  # CSV·키워드DB 전량 읽기)+최근 발행 집합 및 정렬된 후보 목록을 이 초만큼
  # 브랜드별로 캐시한다.
  # 4차(실측 8, 6-5·6-6절) — 작업자가 매번 브랜드를 바꿔 돌아, 120초로는
  # 같은 브랜드로 돌아오기 전에 거의 매번 캐시가 만료됐다(로그로 확정).
  # 정확성(중복 재검사 방지)은 이제 next_priority_batch의 DB 직전 확인이
  # 캐시와 무관하게 지키므로 600초(10분)로 늘려도 안전하다.
  universe_cache_sec: 600
  # 4차 — universe 번들을 작업자 프로세스 간에도 공유하는 파일 캐시 TTL(초).
  # data/exposure_universe_cache/<브랜드>.json, mtime 기준.
  universe_file_cache_sec: 600
  # 한 번에 뽑아 작업자 메모리 큐에 쌓아 둘 후보 수(매번 n=1로 조회하던 것을 배치로).
  # 4차 — WorkerQueue가 이제 브랜드별로 큐를 따로 두므로(이전엔 브랜드가
  # 바뀔 때마다 큐를 통째로 버려 사실상 매번 재조회했다) 이 배치가 실제로
  # 다 소비된다.
  batch_size: 10
  # 2026-09-24 2차(6-2절) — universe 캐시 후에도 개선이 없어 last_checked(DB
  # 전체 이력 쿼리)도 이 초만큼 캐시한다. 러너가 검사 결과를 저장한 직후
  # `exposure_priority.mark_checked`로 그 키워드만 즉시 갱신하므로, 같은
  # 키워드가 TTL 안에 바로 다시 뽑히는 일은 없다.
  last_checked_cache_sec: 20
  # 2026-09-24 5차(실측 9, 6-7·6-8절) — 4차(작업자별 정렬 캐시)로도 중복
  # 재검사가 19.4%로 늘었다(작업자 5개가 각자 계산한 정렬 목록의 앞쪽을
  # 동시에 다툼). 공유 큐(`exposure_queue` 표)로 바꿔, 등급·정렬은 이
  # 초마다 브랜드당 한 프로세스만 갱신하고 선점은 sqlite 원자적 UPDATE로
  # 한다. 기본은 universe_cache_sec과 같지만 따로 조정 가능.
  queue_refresh_sec: 600
  # 공유 큐 선점(claim) TTL(초) — 이 시간 넘게 완료(done_at) 안 된 선점은
  # 죽은 작업자의 것으로 보고 다시 선점 가능하다(기존
  # exposure_runner.INFLIGHT_TTL_SECONDS와 같은 값 유지, 5차에서 파일 기반
  # claim_inflight는 제거하고 이 값으로 대체).
  claim_ttl_sec: 180
