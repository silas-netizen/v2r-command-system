# 모델을 어느 "길"로 부를지 (설계서 docs/reports/quality-parity-strategy-2026-09-21.md)
#
# - plan  : 요금제(구독) 길. Claude Code 를 비대화로 한 번 실행한다. 추가 비용 0원.
#           로그인이 안 되어 있으면 자동으로 다음 길로 넘어가고 경고를 한 번 남긴다.
#           (한 번만 로그인해 두면 됩니다: scripts\claude-cli-login.cmd)
# - batch : 배치 API 길. **아직 만들지 않았습니다.** 자리만 잡혀 있어 그냥 지나갑니다.
# - api   : 일반 API 길. ANTHROPIC_API_KEY 로 부릅니다(돈이 나갑니다).
#
# 어느 길로 가든 모델에 넣는 지침(system)과 요청(user) 글자는 **완전히 같습니다.**
# 원고 JSON과 검토 문서에 어느 길로 만들었는지(backend)와 프롬프트 지문
# (prompt_sha256)이 남아 나중에 대조할 수 있습니다.
#
# 한 번만 다르게 쓰고 싶으면 명령에 "요금제로" / "api로" 를 붙이세요.
# 환경변수 V2R_LLM_BACKEND=plan 으로 통째로 못박을 수도 있습니다.
backend_order: [plan, batch, api]

# 요금제 한도에 걸리면 이만큼 요금제 길을 쉽니다(시간). 코드 기본값과 같습니다.
plan_lock_hours: 5

# GPT(Codex) 교차 검증 — 원고를 만든 뒤 다른 모델에게 한 번 더 읽힙니다.
# ChatGPT 요금제로 부르므로 추가 비용 0원이고, 읽기 전용이라 파일을 건드리지 않습니다.
# 판정은 **우리가 정한 체크리스트 번호 안에서만** 받고, 점수는 (통과 수 / 전체)로
# 우리가 계산합니다. `min_score` 미만이면 "GPT 지적"으로 **한 번만** 부분 재시도합니다.
# codex 를 못 찾거나 시간이 넘으면 "미검증"으로 넘어가고 생성은 막지 않습니다.
crosscheck:
  enabled: true
  min_score: 60
  model: gpt-5.6-sol
  effort: medium
  timeout_sec: 300
