# 실행기 내장 예약표 (1순위). 윈도우 작업 스케줄러는 백업입니다.
# - time: "HH:MM" (한국 시각)
# - days: daily | weekdays | [mon, tue, wed, thu, fri, sat, sun]
# - command: 텔레그램에 보내는 것과 똑같은 한국어 문장
# - catch_up_minutes: 실행기가 꺼져 있었을 때 늦게라도 실행할 시간(분).
#   비워 두면 그날 23:59까지 언제든 따라잡습니다.
catch_up_minutes: null   # 전체 기본값

entries:
  # 브랜드 키워드 발굴(꼬리 물기 BFS) 일괄 — 브랜드 5개 순차, main 스코프(무거운
  # 작업이라 사이드카가 아닌 발행 줄에서 돈다). 09:00 발행 전 끝나야 해서 01:00에
  # 시작하고 최대 6시간 상한(worker.KEYWORD_DISCOVERY_ALL_MAX_SEC)을 둔다.
  # 같은 네이버 프로필(data/browser-profile-naver)을 여는 다른 작업(노출 순환기,
  # 예약 "네이버 세션 점검")과는 naver_session의 프로세스 간 파일 잠금
  # (data/locks/naver-profile.lock)으로 자동으로 순서를 맞춘다.
  - name: 키워드 발굴 전체
    time: "01:00"
    days: daily
    enabled: true
    command: 키워드 발굴 전체 500개

  - name: 아침 일상 글
    time: "09:00"
    days: daily
    enabled: true
    command: 자사 카페 일상 글 카페별 100건 실제 발행 댓글 랜덤

  # V2R 글 목록을 색인에 받아 둡니다. 이게 있어야 예전(메이크/수동) 글과도 중복이 안 납니다.
  # 제휴 카페(브랜드 원고가 실제로 올라가는 곳)는 계정 수가 많아 자사와 합치면
  # 부하가 커서(2026-09-22 실측: 제휴만 계정 215개·행 914건에 115초) 07:45
  # 별도 항목으로 뗐습니다. 키워드 노출 검사가 제휴 카페 글도 찾으려면 이 항목이 있어야 합니다.
  - name: 글 목록 색인 동기화(자사)
    time: "07:30"
    days: daily
    enabled: true
    command: 자사 카페 글 목록 동기화

  - name: 글 목록 색인 동기화(제휴)
    time: "07:45"
    days: daily
    enabled: true
    command: 제휴 카페 글 목록 동기화

  - name: 끊긴 작업 점검
    time: "08:30"
    days: daily
    enabled: true
    command: 끊긴 작업 점검

  # 브랜드별 키워드 노출 현황: 08:00 1회 예약 대신 무한 순환기가 대체한다
  # (docs/reports/keyword-program-plan-2026-09-22.md B2). 사이드카가 5초마다
  # "노출 순환 시작" 상태를 보고 알아서 계속 돈다 — 예약 없음.

  - name: GPT 세션 점검
    time: "09:00"
    days: daily
    enabled: true
    command: GPT 세션 점검

  - name: 네이버 세션 점검-1
    time: "03:10"
    days: daily
    enabled: true
    command: 네이버 세션 점검
  - name: 네이버 세션 점검-2
    time: "09:10"
    days: daily
    enabled: true
    command: 네이버 세션 점검
  - name: 네이버 세션 점검-3
    time: "15:10"
    days: daily
    enabled: true
    command: 네이버 세션 점검
  - name: 네이버 세션 점검-4
    time: "21:10"
    days: daily
    enabled: true
    command: 네이버 세션 점검

  - name: 웹 세션 점검(Claude·Make)
    time: "09:20"
    days: daily
    enabled: true
    command: 웹 세션 점검

  # 요금제(Claude Code) 로그인이 살아 있는지 아주 짧은 호출로 확인합니다.
  # 풀려 있으면 scripts\claude-cli-login.cmd 를 돌리라고 알려 줍니다.
  - name: 요금제 세션 점검
    time: "09:25"
    days: daily
    enabled: true
    command: 요금제 세션 점검

  # 미처리 목록(docs/reports/pending.md)을 하루 5번 파일로 보냅니다.
  - name: pending-1
    time: "08:40"
    days: daily
    enabled: true
    command: 미처리 알림

  - name: pending-2
    time: "11:00"
    days: daily
    enabled: true
    command: 미처리 알림

  - name: pending-3
    time: "14:00"
    days: daily
    enabled: true
    command: 미처리 알림

  - name: pending-4
    time: "17:00"
    days: daily
    enabled: true
    command: 미처리 알림

  - name: pending-5
    time: "21:00"
    days: daily
    enabled: true
    command: 미처리 알림

  # 새 모양 보고서(사용자 지시 2026-09-22). 전부 가벼운 작업이라 사이드카가 집어
  # 가므로 발행 줄을 막지 않습니다.
  # - 02:30 어제 기준 일일 보고  → docs/reports/dashboard-YYYY-MM-DD.html/.md
  # - 12:00·15:00·18:00 오늘 기준 중간 보고 → docs/reports/progress-YYYY-MM-DD-HHMM.html/.md
  - name: 일일 보고
    time: "02:30"
    days: daily
    enabled: true
    command: 일일 보고

  - name: 중간 보고-1
    time: "12:00"
    days: daily
    enabled: true
    command: 중간 보고

  - name: 중간 보고-2
    time: "15:00"
    days: daily
    enabled: true
    command: 중간 보고

  - name: 중간 보고-3
    time: "18:00"
    days: daily
    enabled: true
    command: 중간 보고

  # 주 1회 정비 — 30일 지난 이벤트 정리 + DB VACUUM + 요금제 임시 파일 +
  # 브라우저 프로필 캐시(쿠키·로그인은 건드리지 않음). 가벼운 작업이라
  # 사이드카가 집어서 돌리므로 발행 줄을 막지 않습니다. (2026-09-22)
  - name: 정기 정비
    time: "03:00"
    days: [sun]
    enabled: true
    command: 정기 정비

  # 밀려남 키워드 → 브랜드 원고 대량 생성 (2026-09-23). 요금제 길만 쓰고
  # (config/bulk.yaml allow_paid_fallback: false) 09:00 전에 끝나도록 작게
  # 시작한다. 상한 5시간(요금제 창) 안에 끝나지 않아도 다음 발행에 지장 없게
  # 새벽 시간을 골랐다.
  - name: 대량 원고 새벽 배치
    time: "02:10"
    days: daily
    enabled: true
    command: 대량 원고 전체 20건
