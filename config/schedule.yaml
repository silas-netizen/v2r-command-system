  - name: 중간 보고-2
    time: "15:00"
    days: daily
    enabled: true
    command: 중간 보고

  - name: 중간 보고-3
    time: "18:00"
    days: daily
    enabled: true
    command: 중간 보고

  # 주 1회 정비 — 30일 지난 이벤트 정리 + DB VACUUM + 요금제 임시 파일 +
  # 브라우저 프로필 캐시(쿠키·로그인은 건드리지 않음). 가벼운 작업이라
  # 사이드카가 집어서 돌리므로 발행 줄을 막지 않습니다. (2026-09-22)
  - name: 정기 정비
    time: "03:00"
    days: [sun]
    enabled: true
    command: 정기 정비
