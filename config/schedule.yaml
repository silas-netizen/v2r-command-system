  # 새 모양 보고서(사용자 지시 2026-09-22). 전부 가벼운 작업이라 사이드카가 집어
  # 가므로 발행 줄을 막지 않습니다.
  # - 02:30 어제 기준 일일 보고  → docs/reports/dashboard-YYYY-MM-DD.html/.md
  # - 12:00·15:00·18:00 오늘 기준 중간 보고 → docs/reports/progress-YYYY-MM-DD-HHMM.html/.md
  - name: 일일 보고
    time: "02:30"
    days: daily
    enabled: true
    command: 일일 보고

  - name: 중간 보고-1
