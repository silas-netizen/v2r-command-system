# 알림 등급 정책 (사용자 지시 2026-09-23: "메시지가 너무 많아 경중을 못 고른다")
#
# 코드가 참조하는 건 v2r/channels/__init__.py 의 상수뿐이고, 이 파일은
# 사람이 보는 설명서다(운영 중 값 튜닝은 상수를 고친다).
#
# critical (즉시 전송, 사건당 1회 + 복구 1회, 앞에 "🔴"):
#   - 발행 정지 / 예약 작업 미복구
#   - 로그인 풀림 · 재로그인 필요
#   - 실행기·사이드카 죽음 / 자동 재시작 실패
#   - 요금제(ChatGPT 등) 한도로 생성 중단
#   - 계정 등록 제한 다발 (5건 이상)
#
# summary (채널로 따로 안 보냄 → 정기 보고에만 포함):
#   - 작업 완료·실패 건수
#   - 감시 경고 복구
#   - 미처리 목록 (하루 5회 → 18:00 1회로 축소)
#
# info (채널로 안 보냄 → 로그·DB 이벤트·현황판에만):
#   - 작업 시작/종료 한 줄, 예약 발사, "실행기 시작됨"
#   - 자동 진단(자가복구) 문구("판정: … / 조치 … / 시도함 … / 다시 하려면 …")
#
# always (등급 분류 밖 — 사용자가 채널에서 직접 보낸 명령의 응답):
#   - 예: 중지, 사진 승인/반려, 슬랙·텔레그램 연결 점검 결과
#   - 항상 채널로 보낸다(등급 억제 대상이 아니다).

critical_repeat_seconds: 600   # 같은 사건 경고를 되풀이하지 않는 간격

# 채널로 실제 내보낼 critical 범주(사용자 지시 2026-09-23 "진짜 실패만").
# category 문자열의 접두어가 이 목록의 항목으로 시작하면 통과, 아니면 summary로
# 강등(로그에만 남고 채널로 안 나간다). 코드: v2r/channels/__init__.py _critical_allowed().
#   (a) 발행 실패(끊긴 작업 점검까지 거친 뒤에도 남은 실패)
#   (b) 실행기/사이드카 죽음 + 자동 재시작 실패
#   (c) 예약 발사 실패 + 자동 복구 실패
#   (d) 로그인 풀림(백업 복구·상주 크롬 확인까지 실패)
#   (e) 요금제 한도로 생성 중단
#   (f) 계정 등록 제한 5건 이상
critical_categories:
  - publish_failed_confirmed   # (a)
  - sidecar_heartbeat_stale    # (b) 사이드카/실행기 죽음(재시작 실패까지 확인 후, sidecar.py)
  - sidecar_restart_exhausted  # (b) 자동 재시작도 실패(worker.py)
  - schedule_mismatch          # (c) 예약이 다른 작업으로 잘못 해석돼 발사를 막음(schedule.py fire)
  - schedule_recovery_failed   # (c) 예약 발사 실패 + 자동 복구(재시도)까지 실패(schedule.py watchdog)
  - relogin_needed             # (d) 로그인 풀림(백업 복구 실패까지 확인 후)
  - gpt_login_pending          # (d)
  - gpt_image_quota            # (e) 요금제 한도
  - plan_quota_stopped         # (e)
  - register_limit_spike       # (f) 계정 등록 제한 5건 이상 (reconcile.py)

# 채널에서 "접수 — 약 N분 예상" 1줄을 보낼 오래 걸리는 작업(사용자 지시 2026-09-23).
# 코드: v2r/channels/freeform.py _long_job_eta().
long_job_tasks:
  publish_daily: 8
  publish_brand: 8
  publish_info: 8
  publish_batch: 10
  bulk_generate: 6
  bulk_generate_all: 15
  keyword_discovery: 5
  keyword_discovery_all: 15
  generate_photos: 5

# 범주 아이콘 (사용자 지시 2026-09-23: 텔레그램·슬랙 메시지 구분).
# 코드는 v2r/channels/__init__.py 의 CATEGORY_ICONS 를 실제로 쓴다 — 여기는 설명서.
# 등급 아이콘(🔴 critical / 🟡 summary)과 조합돼 앞에 붙는다.
# 예: "🔴📢 발행 정지 — 작업 123 …", "🟡📊 중간 보고 12:00 …", "💬 상태: …"
category_icons:
  publish: "📢"        # 일상·브랜드 발행 결과
  login: "🔑"          # 로그인·세션
  schedule: "⏰"        # 예약·실행기
  keyword: "🔍"        # 키워드·노출
  draft: "✍️"          # 원고·이미지 생성
  dashboard: "📊"      # 현황판 / 중간·일일 보고
  reply: "💬"          # 사용자 직접 명령 응답 (always 등급)
  maintenance: "🛠"    # 정비

# 푸시(보고·경고·현황판)를 실제로 보낼 채널. 사용자 지시 2026-09-23 "텔레는 일단 중지, 슬랙만".
# 비우거나 지우면 전부 보낸다. 명령 수신과 그 답장은 이 목록과 무관하다. (60초마다 다시 읽음)
push_channels: [slack]
