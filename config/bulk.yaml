# 브랜드 대량 원고 생성 설정 (2026-09-23)
# 사용자 방침: 0원(요금제 길) 우선. 요금제 한도에 걸리면 유료 길로 넘어가지
# 않고 **대기**한다.
#
# 사용자 결정(2026-09-23 01:20): 대량 생성은 예약이 아니라 명령으로만
# 시작한다(config/schedule.yaml의 새벽 배치는 꺼 둠).
#
# 사용자 지시 갱신(2026-09-23 01:35): 우리 실행기 발행은 하루 50건이지만
# **가상 PC에서 하루 수백 건을 따로 처리**한다. 그래서 생성량을 발행
# 50건에 묶지 않는다 — `대량 원고 전체 N건`은 요청한 만큼 만든다(요금제
# 한도에 걸리면 대기). 재고 상한은 오직 `max_ready`(전체 브랜드·전체
# target 합계)뿐이다.
#
# 구분자 `target`: v2r(우리 실행기 발행분, 하루 50건) / vpc(가상 PC로
# 내보낼 나머지). 기본 배정은 `v2r_daily_cap`까지는 v2r, 그 이후 새로
# 채우는 항목은 vpc — 명령에 `가상pc`를 붙이면 그 브랜드 전체를 강제로
# vpc로 채운다(`우아덤 대량 원고 100건 가상pc`).
bulk:
  allow_paid_fallback: false
  brands:
    - 우아덤
    - 장으뜸
    - 코숨핏
    - 뉴더미스
    - 팥순이
  # 재고(ready 상태, 모든 target 합계) 상한 — 이 이상이면 더 만들지 않는다
  max_ready: 2000
  # target 기본 배정 경계 — 오늘 새로 채우는 v2r 대상 건수가 이 값에
  # 닿을 때까지는 v2r, 그다음부터는 vpc로 채운다(우리 발행 하루 상한과 동일)
  v2r_daily_cap: 50
  # 브랜드별 하루 기본 할당(밀려남 키워드 수 비례, 합 50 = v2r_daily_cap).
  # `대량 원고 전체 N건`에서 N을 생략했을 때만 쓴다. 사용자가 바꿀 수 있다.
  daily_quota:
    우아덤: 20
    팥순이: 14
    장으뜸: 9
    코숨핏: 4
    뉴더미스: 3
